<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona gioco "Abbina le Coppie": due carte (una coperta, una con cuore). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Memory">
  <circle cx="110" cy="110" r="100" fill="#FFFFFF" stroke="#EADFE6" stroke-width="3"/>
  <!-- carta coperta -->
  <g transform="rotate(-14 96 118)">
    <rect x="52" y="58" width="80" height="108" rx="14" fill="#2E5BFF"/>
    <rect x="52" y="58" width="80" height="108" rx="14" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="92" y="128" font-family="system-ui,Arial,sans-serif" font-size="58" font-weight="900"
          fill="#FFFFFF" text-anchor="middle">?</text>
  </g>
  <!-- carta scoperta con cuore -->
  <g transform="rotate(10 130 116)">
    <rect x="92" y="56" width="80" height="108" rx="14" fill="#FFD3E4"/>
    <rect x="92" y="56" width="80" height="108" rx="14" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M132 142 C108 124 110 100 124 100 C131 100 132 106 132 108
             C132 106 133 100 140 100 C154 100 156 124 132 142 Z" fill="#E8488B"/>
  </g>
</svg>
