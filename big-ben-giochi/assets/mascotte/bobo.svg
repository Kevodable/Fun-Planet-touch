<?xml version="1.0" encoding="UTF-8"?>
<!-- BOBO — orsetto marrone con maglietta blu Kids Fun Planet.
     Mascotte stilizzata Kids Fun Planet (ispirata all'arte ufficiale). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Bobo">
  <ellipse cx="120" cy="290" rx="62" ry="9" fill="#2A1622" opacity=".12"/>
  <!-- gambe -->
  <ellipse cx="100" cy="266" rx="20" ry="24" fill="#B5793B"/>
  <ellipse cx="140" cy="266" rx="20" ry="24" fill="#B5793B"/>
