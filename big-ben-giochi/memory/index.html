<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kids Fun Planet - Memory Game</title>
<meta name="theme-color" content="#7c6bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memory Game">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- Font: stack di sistema (niente CDN, funziona offline nel kiosk) -->
<link rel="stylesheet" href="style.css">
<style>
  /* Pulsante Esci del kiosk, sovrapposto al gioco (target tap >= 64px) */
  #bb-exit-kiosk{
    position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:calc(env(safe-area-inset-left) + 10px);
    z-index:9999; min-height:64px; min-width:64px; padding:0 22px;
    display:inline-flex; align-items:center; gap:8px;
    border:none; border-radius:999px; cursor:pointer;
    background:#7A1F3D; color:#fff; font-weight:800;
    font-size:20px; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    box-shadow:0 8px 20px rgba(122,31,61,.35);
  }
  #bb-exit-kiosk:active{ transform:scale(.94); }
</style>
</head>
<body>
  <!-- Per uscire si usa il pulsante flottante "🏠 Giochi" del launcher (unico). -->

  <div class="sky">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="star-twinkle s1">⭐</div>
    <div class="star-twinkle s2">✨</div>
    <div class="star-twinkle s3">🌟</div>
    <div class="star-twinkle s4">✨</div>
  </div>

  <div class="game-container">
    <div class="layout">
      <header>
        <div class="logo-wrap">
          <img src="assets/mascots/banner.jpg" alt="Kids Fun Planet" class="banner-img">
          <h1>🎉 Memory Game 🎉</h1>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-icon">🕹️</span>
            <span class="stat-label">Mosse</span>
            <span id="moves" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-icon">⏱️</span>
            <span class="stat-label">Tempo</span>
            <span id="timer" class="stat-value">00:00</span>
          </div>
          <div class="stat">
            <span class="stat-icon">💎</span>
            <span class="stat-label">Coppie</span>
            <span id="pairs" class="stat-value">0/8</span>
          </div>
        </div>

        <div class="controls">
          <button id="restart-btn">🔄 Nuova partita</button>
          <select id="difficulty">
            <option value="8">🌈 Facile (4x4)</option>
            <option value="18">🚀 Difficile (6x6)</option>
          </select>
        </div>
      </header>

      <main id="board" class="board"></main>
    </div>

    <div id="win-overlay" class="overlay hidden">
      <div class="confetti-layer" id="confetti-layer"></div>
      <div class="win-card">
        <img src="assets/mascots/cards/stella.jpg" alt="Stella" class="win-mascot">
        <h2>🎉 Hai vinto! 🎉</h2>
        <p>Mosse: <span id="final-moves"></span></p>
        <p>Tempo: <span id="final-time"></span></p>
        <button id="play-again-btn">✨ Gioca ancora ✨</button>
      </div>
    </div>
  </div>

  <!-- Utility condivise del kiosk (BB.home, ecc.) -->
  <script src="../assets/shared.js"></script>
  <script>
    // Uscita: pulsante flottante "🏠 Giochi" del launcher. Auto-ritorno dopo 60s.
    BB.idle(60000, BB.home);
  </script>
  <script src="script.js"></script>
</body>
</html>
